<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5;color:#1a1a1a;padding:16px;}
h1{text-align:center;font-size:20px;color:#f97316;margin-bottom:12px;}
.search-box{position:sticky;top:0;z-index:10;background:#f0f2f5;padding:8px 0 12px;}
.search-box input{width:100%;padding:14px;border:2px solid #ddd;border-radius:12px;font-size:16px;outline:none;}
.search-box input:focus{border-color:#f97316;}
.results{font-size:13px;}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.card-tienda{font-size:15px;font-weight:800;color:#f97316;margin-bottom:4px;}
.card-num{font-size:11px;color:#888;float:right;}
.card-eq{font-size:11px;color:#666;margin-bottom:8px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.info-item{background:#f9fafb;border-radius:8px;padding:8px;}
.info-item .lbl{font-size:9px;color:#888;text-transform:uppercase;font-weight:700;}
.info-item .val{font-size:13px;font-weight:700;color:#1a1a1a;word-break:break-all;}
.info-item .val.rustdesk{color:#7c3aed;}
.info-item .val.anydesk{color:#059669;}
.info-item .val.ip{color:#2563eb;}
.info-item.full{grid-column:1/-1;}
.copy-btn{background:none;border:1px solid #ddd;border-radius:6px;padding:2px 6px;font-size:10px;cursor:pointer;color:#666;float:right;}
.copy-btn:active{background:#f97316;color:#fff;border-color:#f97316;}
.sub-equipos{margin-top:10px;border-top:1px solid #eee;padding-top:8px;}
.sub-equipos h4{font-size:11px;color:#888;margin-bottom:6px;}
.sub-card{background:#f9fafb;border-radius:8px;padding:8px;margin-bottom:4px;font-size:11px;display:flex;justify-content:space-between;align-items:center;}
.sub-card .eq-name{font-weight:700;color:#555;}
.sub-card .eq-ip{color:#2563eb;font-weight:600;}
.sub-card .eq-ad{color:#7c3aed;font-weight:600;}
.empty{text-align:center;color:#999;padding:40px;font-size:14px;}
.count{text-align:center;font-size:11px;color:#999;margin-bottom:8px;}
</style>
</head>

function copiar(texto){
  navigator.clipboard.writeText(texto).then(()=>toast('Copiado'));
}
function toast(msg){
  const t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:999;';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),1500);
}

function buscar(){
  const q = document.getElementById('buscador').value.toLowerCase().trim();
  const el = document.getElementById('results');
  if(!q){ el.innerHTML='<div class="empty">Escribe para buscar...</div>'; document.getElementById('count').textContent=''; return; }
  
  const filtrados = TIENDAS.filter(t=>{
    const busq = [t.n,t.tienda,t.eq,t.host,t.user,t.pass,t.ip,t.rustdesk,t.rdpass,t.anydesk,t.adpass,t.iptbk,t.sertbk,t.obs].join(' ').toLowerCase();
    return q.split(' ').every(p=>busq.includes(p));
  });
  
  if(filtrados.length===0){ el.innerHTML='<div class="empty">Sin resultados</div>'; document.getElementById('count').textContent=''; return; }
  
  document.getElementById('count').textContent=filtrados.length+' resultado(s)';
  
  // Agrupar por tienda
  const tiendas = {};
  filtrados.forEach(t=>{
    const key = t.n+'-'+t.tienda;
    if(!tiendas[key]) tiendas[key]={poa:null,eqs:[]};
    if(t.eq==='POA') tiendas[key].poa=t;
    else tiendas[key].eqs.push(t);
  });
  
  let html='';
  Object.values(tiendas).forEach(grp=>{
    const poa = grp.poa || grp.eqs[0];
    html+='<div class="card">';
    html+='<span class="card-num">#'+poa.n+'</span>';
    html+='<div class="card-tienda">'+poa.tienda+'</div>';
    html+='<div class="card-eq">'+poa.host+' · '+poa.ip+'</div>';
    
    html+='<div class="info-grid">';
    
    if(poa.anydesk){
      html+='<div class="info-item"><div class="lbl">AnyDesk POA <button class="copy-btn" onclick="copiar(\''+poa.anydesk+'\')">Copiar</button></div><div class="val anydesk">'+poa.anydesk+'</div></div>';
      html+='<div class="info-item"><div class="lbl">Clave AnyDesk <button class="copy-btn" onclick="copiar(\''+poa.adpass+'\')">Copiar</button></div><div class="val">'+poa.adpass+'</div></div>';
    }
    if(poa.rustdesk){
      html+='<div class="info-item"><div class="lbl">RustDesk <button class="copy-btn" onclick="copiar(\''+poa.rustdesk+'\')">Copiar</button></div><div class="val rustdesk">'+poa.rustdesk+'</div></div>';
      html+='<div class="info-item"><div class="lbl">Clave RustDesk <button class="copy-btn" onclick="copiar(\''+poa.rdpass+'\')">Copiar</button></div><div class="val">'+poa.rdpass+'</div></div>';
    }
    if(poa.ip){
      html+='<div class="info-item"><div class="lbl">IP <button class="copy-btn" onclick="copiar(\''+poa.ip+'\')">Copiar</button></div><div class="val ip">'+poa.ip+'</div></div>';
    }
    if(poa.user){
      html+='<div class="info-item"><div class="lbl">User / Pass <button class="copy-btn" onclick="copiar(\''+poa.user+'\\n'+poa.pass+'\')">Copiar</button></div><div class="val">'+poa.user+'<br>'+poa.pass+'</div></div>';
    }
    if(poa.obs){
      html+='<div class="info-item full"><div class="lbl">Observaciones</div><div class="val">'+poa.obs+'</div></div>';
    }
    
    html+='</div>';
    
    if(grp.eqs.length>0){
      html+='<div class="sub-equipos"><h4>Equipos ('+grp.eqs.length+')</h4>';
      grp.eqs.forEach(eq=>{
        html+='<div class="sub-card">';
        html+='<span class="eq-name">'+eq.eq+' · '+eq.host+'</span>';
        html+='<span>';
        if(eq.anydesk) html+='<span class="eq-ad" onclick="copiar(\''+eq.anydesk+'\')" style="cursor:pointer" title="Copiar AnyDesk">'+eq.anydesk+'</span>';
        if(eq.ip) html+=' · <span class="eq-ip" onclick="copiar(\''+eq.ip+'\')" style="cursor:pointer" title="Copiar IP">'+eq.ip+'</span>';
        html+='</span></div>';
      });
      html+='</div>';
    }
    
    html+='</div>';
  });
  
  el.innerHTML=html;
}

buscar();
